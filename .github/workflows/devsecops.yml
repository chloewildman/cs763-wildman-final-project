name: DevSecOps Pipeline

on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 25
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 25
      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw
      - name: Run tests
        run: ./mvnw test
      - name: Build 
        run: ./mvnw -B package -DskipTests
        