name: DevSecOps Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: cs763-student-demo:${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Make Maven wrapper executable
        run: chmod +x mvnw
      - name: Set up Python for Semgrep
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check semgrep
      - name: Scan source with Semgrep
        run: semgrep scan --config p/default --metrics=off .
      - name: Run tests
        run: ./mvnw -B test
      - name: Package application
        run: ./mvnw -B package -DskipTests
      - name: Build Docker image
        run: docker build --tag "$IMAGE_NAME" .
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
        