spring.application.name=research-discussion-board
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/discussions;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.h2.console.enabled=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
management.endpoints.web.exposure.include=health,info
app.jwt.jwk-set-uri=${JWT_JWK_SET_URI:http://localhost:9000/.well-known/jwks.json}
app.jwt.issuer=${JWT_ISSUER:http://localhost:9000}
app.jwt.audience=${JWT_AUDIENCE:cs763-api}
app.encryption.field-key=${FIELD_ENCRYPTION_KEY:}
app.rate-limit.max-requests=50
app.rate-limit.window=60s
app.rate-limit.lockout=10s
app.rate-limit.expensive-min-interval=250ms
